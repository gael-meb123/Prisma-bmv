AWSTemplateFormatVersion: '2010-09-09'
Description: Prueba aislada de captura segura sin scheduler y sin escritura productiva.
Parameters:
  LambdaRoleArn:
    Type: String
  LayerArn:
    Type: String
  ArtifactBucket:
    Type: String
  ArtifactKey:
    Type: String
Resources:
  Prueba:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.11
      Handler: infra.lambda.recolector_seguro.prueba_aws.lambda_handler
      Role: !Ref LambdaRoleArn
      Layers: [!Ref LayerArn]
      MemorySize: 512
      Timeout: 120
      ReservedConcurrentExecutions: 1
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Ref ArtifactKey
Outputs:
  Funcion:
    Value: !Ref Prueba
